# Base PostgreSQL locale pour le développement : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: electropro
      POSTGRES_USER: electropro
      POSTGRES_PASSWORD: electropro
    ports:
      - "5433:5432"
    volumes:
      - electropro-data:/var/lib/postgresql/data
volumes:
  electropro-data:
